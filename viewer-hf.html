<!doctype html>
<html custom-hf="HyperFrameset" lang="">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RSMF Viewer</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { display: flex; }
    nav { width: 25%; background-color: lightgray; padding: 1em; box-sizing: border-box; overflow-y: auto; }
    main { width: 50%; padding: 1em; box-sizing: border-box; overflow-y: auto; }
    aside { width: 25%; background-color: mintcream; padding: 1em; box-sizing: border-box; overflow-y: auto; }
    hf-frame { display: block; }
    figure { margin: 0; }
    .message { margin-bottom: 1em; }
    .thread { margin-left: 2em; }
    time { color: gray; font-size: small; }
    img.attachment { max-width: 10vw; max-height: 20vh; border: 2px solid gray; }
    img.attachment { cursor: pointer; }
    figure.avatar { margin: 0; display: flex; justify-content: center; }
    figure.avatar img { width: 96px; height: 96px; object-fit: cover; border-radius: 50%; cursor: pointer; }
    .avatar-fallback {
      width: 96px; height: 96px; border-radius: 50%;
      background: #6b7280; color: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 2em; font-weight: bold;
    }
    .participant { text-align: center; }
    .participant h2 { margin: 0.5em 0 0.25em; }
    .participant dl { text-align: left; display: grid; grid-template-columns: auto 1fr; gap: 0.25em 0.5em; margin: 1em 0; }
    .participant dt { font-weight: bold; }
    .participant dd { margin: 0; overflow-wrap: break-word; }
    #popup::backdrop { background-color: rgba(0, 0, 0, 0.75); }
    #popup img { max-width: 80vw; max-height: 80vh; }
  </style>
  <script>
    var basePath = (() => {
      const options = new URLSearchParams(document.location.search);
      return options.has('data') ? options.get('data') : 'data';
    })();
    if (!basePath.endsWith('/')) basePath += '/';

    function getInitials(name) {
      let parts = name.replace(/[^a-zA-Z\s]/g, '').trim().split(/[\s._-]+/);
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      return (name[0] || '?').toUpperCase();
    }

    function showParticipant(id) {
      let p = rsmf.getParticipantById(id);
      if (!p) return;
      let frameEl = document.querySelector('hf-frame[targetname="participant"]');
      if (!frameEl || !frameEl.$) return;
      frameEl.load({ url: document.URL, type: 'json', document: {
        id: p.id,
        display: p.display || p.id,
        initials: getInitials(p.display || p.id),
        email: p.email || null,
        emailHref: p.email ? 'mailto:' + p.email : null,
        avatar: p.avatar || null,
        avatarUrl: p.avatar ? basePath + p.avatar : null,
        custom: p.custom || []
      }});
    }

    function buildMessagesData(conversationId) {
      let events = rsmf.getEvents(conversationId, rsmf.NONE);
      let buildEvent = (event, includeChildren) => {
        let participant = rsmf.getParticipantById(event.participant);
        let data = {
          id: event.id,
          participant: event.participant,
          participantName: participant?.display || event.participant || 'Unknown',
          timestamp: event.timestamp || '',
          body: event.body || '',
          attachments: (event.attachments || []).map(att => ({
            id: att.id, display: att.display, url: basePath + att.id,
            isImage: /\.(jpg|jpeg|gif|png)$/i.test(att.display)
          }))
        };
        if (includeChildren) {
          data.children = rsmf.getEvents(rsmf.ALL, event.id).map(child => buildEvent(child, false));
        }
        return data;
      };
      return { messages: events.map(event => buildEvent(event, true)) };
    }
  </script>
</head>
<body>
<script for>
({
  lookup: function(url) { return 'messages'; }
})
</script>

<nav>
  <form data-target="messages">
  <script for>({
    onsubmit(e) {
      e.preventDefault();
      let frameEl = document.querySelector(`hf-frame[targetname="${this.element.dataset.target}"]`);
      if (!frameEl || !frameEl.$) return;
      let conversationId = this.element.elements['conversationId']?.value || null;
      let data = buildMessagesData(conversationId);
      frameEl.load({ url: document.URL, type: 'json', document: data });
    }
  })</script>
    <label>Filter by conversation:</label><br />
    <hf-frame targetname="conversations">
      <hf-body condition="loaded">
        <hf-transform type="hazard" format="json">
          <select name="conversationId">
          <script for>({ onchange() { this.element.form.requestSubmit(); } })</script>
            <option value="">ALL</option>
            <option haz:each="conversations" expr:value="id" expr:_text="display"></option>
          </select>
        </hf-transform>
      </hf-body>
    </hf-frame>
  </form>
</nav>

<main>
  <hf-frame targetname="messages">
    <hf-body condition="loaded">
      <hf-transform type="hazard" format="json">
        <section role="feed">
        <haz:template name="message">
          <article class="message">
            <header>
              <a href="#" expr:data-participant="participant">@<span expr:_text="participantName"></span></a>
              <script for>({ onclick(e) { e.preventDefault(); showParticipant(this.element.dataset.participant); } })</script>
              <span>&nbsp;&nbsp;</span>
              <time expr:_text="timestamp"></time>
            </header>
            <p expr:_text="body"></p>
            <haz:each select="attachments">
              <figure>
                <haz:if test="isImage">
                  <img class="attachment" expr:src="url" expr:title="display"/>
                  <script for>({ onclick() { let popup = document.getElementById('popup'); popup.querySelector('img').src = this.element.src; popup.showModal(); } })</script>
                </haz:if>
                <haz:unless test="isImage">
                  <a expr:href="url" target="_blank" expr:_text="display"></a>
                </haz:unless>
              </figure>
            </haz:each>
          </article>
        </haz:template>
        <haz:each select="messages">
          <haz:call name="message"></haz:call>
          <haz:each select="children">
            <div role="group" class="thread">
              <haz:call name="message"></haz:call>
            </div>
          </haz:each>
        </haz:each>
        </section>
      </hf-transform>
    </hf-body>
    <hf-body condition="loading">
      <p>Select a conversation...</p>
    </hf-body>
  </hf-frame>
</main>

<aside>
  <hf-frame targetname="participant">
    <hf-body condition="loaded">
      <hf-transform type="hazard" format="json">
        <article class="participant">
          <figure class="avatar">
            <haz:if test="avatar">
              <img class="avatar" expr:src="avatarUrl" expr:alt="display" />
              <script for>({ onclick() { let popup = document.getElementById('popup'); popup.querySelector('img').src = this.element.src; popup.showModal(); } })</script>
            </haz:if>
            <haz:unless test="avatar">
              <span class="avatar-fallback" expr:_text="initials"></span>
            </haz:unless>
          </figure>
          <h2 expr:_text="display"></h2>
          <dl>
            <dt>ID</dt>
            <dd expr:_text="id"></dd>
            <haz:if test="email">
              <dt>Email</dt>
              <dd><a expr:href="emailHref" expr:_text="email"></a></dd>
            </haz:if>
            <haz:each select="custom">
              <dt expr:_text="name"></dt>
              <dd expr:_text="value"></dd>
            </haz:each>
          </dl>
        </article>
      </hf-transform>
    </hf-body>
  </hf-frame>
</aside>

<dialog id="popup">
<script for>({ onclick() { this.element.close(); } })</script>
  <img src="" />
</dialog>

</body>

<script src="./js/vendor/HyperFrameset.js"></script>
<script type="module">
import RsmfAdapter from './js/rsmfadapter.mjs';

let url = basePath + 'rsmf_manifest.json';
let manifest = await fetch(url).then(r => r.json());
globalThis.rsmf = new RsmfAdapter(manifest);

await Meeko.framer.start();

// Populate conversation select
let convFrame = document.querySelector('hf-frame[targetname="conversations"]');

convFrame.load({ url: document.URL, type: 'json', document: {
  conversations: rsmf.getConversations().map(c => ({ id: c.id, display: c.display || c.id }))
}});

// Load all messages on page load
document.querySelector('form[data-target="messages"]').requestSubmit();
</script>
</html>
